<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A1B5E"/><stop offset="1" stop-color="#0D0B26"/></linearGradient>
    <linearGradient id="ray6" gradientUnits="userSpaceOnUse" x1="0" y1="800" x2="0" y2="230"><stop offset="0" stop-color="#FFD978" stop-opacity=".95"/><stop offset="1" stop-color="#F0A93A" stop-opacity=".18"/></linearGradient>
    <linearGradient id="gold6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#E9A93A"/></linearGradient>
    <radialGradient id="glow6"><stop offset="0" stop-color="#FFF8E0"/><stop offset=".35" stop-color="#FFD978" stop-opacity=".85"/><stop offset="1" stop-color="#F0A93A" stop-opacity="0"/></radialGradient>
    <filter id="soft6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    <style>
      .b { animation: parpadeo 2.4s ease-in-out infinite; }
      @keyframes parpadeo { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
      .c { animation: cae var(--d) linear var(--r) infinite; }
      @keyframes cae { from { transform: translateY(-30px); } to { transform: translateY(1060px); } }
      @media (prefers-reduced-motion: reduce) { .b, .c { animation: none; } .b { opacity: 1; } .c { display: none; } }
    </style>
    <clipPath id="clipNavidad"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg6)"/>
